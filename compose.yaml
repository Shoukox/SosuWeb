services:
  nginx-service:
    image: nginx
    volumes:
     - ./nginx/nginx.conf:/etc/nginx/nginx.conf
     - ./nginx/shoukko.de-cf.pem:/etc/ssl/shoukko.de-cf.pem
     - ./nginx/shoukko.de-cf.key:/etc/ssl/shoukko.de-cf.key
     - ./nginx/authenticated_origin_pull_ca.pem:/etc/ssl/authenticated_origin_pull_ca.pem
    restart: always
    ports:
     - "443:443"
    environment:
     - NGINX_HOST=sosubot.shoukko.de
     - NGINX_PORT=80
    depends_on:
      - sosuweb-service
      - sosuweb-render-service
    networks:
      - custom

  sosuweb-render-service:
    build:
      context: .
      dockerfile: ./SosuWeb.Render/Dockerfile
    restart: always
    volumes:
     - /skins:/app/skins:rw
     - /videos:/app/videos:rw
     - /thumbnails:/app/thumbnails:rw
     - ./SosuWeb.Render/replays:/app/replays:rw
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_HTTP_PORTS: 5000
      ConnectionStrings__Postgres: "Host=db-service;Port=5432;Database=${POSTGRES_DB:-sosubot_renderer};Username=${POSTGRES_USER:-sosubot}"
      Database__PasswordFile: /run/secrets/db-password
      Database__MigrateOnStartup: "false"
      # Set CLIENT_RENDERER_LATEST_VERSION together with each ClientRenderer release.
      ClientRenderer__LatestVersion: "${CLIENT_RENDERER_LATEST_VERSION:-2.0.12}"
    secrets:
      - db-password
    networks:
      - custom
    depends_on:
      database-migrator:
        condition: service_completed_successfully
      db-service:
        condition: service_healthy

  sosuweb-service:
    build:
      context: .
      dockerfile: ./SosuWeb/Dockerfile
    restart: always
    ports:
      - "5001:5001"
    environment:
      ASPNETCORE_HTTP_PORTS: 5001
      ConnectionStrings__Postgres: "Host=db-service;Port=5432;Database=${POSTGRES_DB:-sosubot_renderer};Username=${POSTGRES_USER:-sosubot}"
      Database__PasswordFile: /run/secrets/db-password
      Database__MigrateOnStartup: "false"
    secrets:
      - db-password
    networks:
      - custom
    depends_on:
      database-migrator:
        condition: service_completed_successfully
      sosuweb-render-service:
        condition: service_started
      db-service:
        condition: service_healthy

  database-migrator:
    build:
      context: .
      dockerfile: ./SosuWeb/Dockerfile
    restart: "no"
    environment:
      ConnectionStrings__Postgres: "Host=db-service;Port=5432;Database=${POSTGRES_DB:-sosubot_renderer};Username=${POSTGRES_USER:-sosubot}"
      Database__PasswordFile: /run/secrets/db-password
      Database__MigrateOnly: "true"
    secrets:
      - db-password
    depends_on:
      db-service:
        condition: service_healthy
    networks:
      - custom

  db-service:
    image: postgres:17-alpine
    restart: always
    secrets:
      - db-password
    volumes:
      - ./db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-sosubot_renderer}"
      POSTGRES_USER: "${POSTGRES_USER:-sosubot}"
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U '${POSTGRES_USER:-sosubot}' -d '${POSTGRES_DB:-sosubot_renderer}'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - custom

secrets:
  db-password:
    file: .secrets/.db_password

networks:
    custom:
      enable_ipv4: true
      enable_ipv6: false
      driver: bridge
